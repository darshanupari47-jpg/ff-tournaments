<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Fire Tournaments</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7EAE3;--surface:#F6F7F3;--ink:#15211A;--muted:#5B6A60;--line:#C5CCC0;--accent:#D9430F;--accent-ink:#fff;--forest:#1F3A2E;--forest-ink:#EAF1EA}
@media (prefers-color-scheme:dark){:root{--bg:#0F1712;--surface:#18231D;--ink:#E8EDE6;--muted:#9AAA9F;--line:#2B3A31;--accent:#FF6A33;--accent-ink:#1A0A03;--forest:#2A4A3A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;padding-bottom:84px}
h1,h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;margin:0;line-height:1}
header{background:var(--forest);color:var(--forest-ink);padding:22px 18px 20px}
header h1{font-size:40px}
header p{margin:6px 0 0;opacity:.8;font-size:14px}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:28px}
.meta{color:var(--muted);font-size:14px;margin:6px 0 12px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:8px}
.slots{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:12px}
.slots i{height:10px;background:var(--line);border-radius:1px}
.slots i.on{background:var(--accent)}
.btns{display:flex;gap:8px;margin-top:14px}
button{font:700 15px Figtree,sans-serif;border-radius:8px;padding:11px 16px;min-height:44px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sched{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.sched li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tag{display:inline-block;background:var(--forest);color:var(--forest-ink);border-radius:4px;padding:2px 8px;font-size:13px;font-weight:700}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;min-height:56px;color:var(--muted);font-size:14px}
nav button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;font-size:14px;display:none;max-width:608px;margin:0 auto}
.note{font-size:13px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header><h1>Free Fire Tournaments</h1><p>Register your squad, check the schedule, drop in.</p></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<nav id="nav" aria-label="Main"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://tzsmcevnjmzmcqoeefwe.supabase.co";
const SUPABASE_KEY="sb_publishable_EZMgbJRdauu3x9U00WmTVA__0rjANQQ";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAPS=["Bermuda","Purgatory","Kalahari","Bermuda"];
const blankTeam=()=>({name:"",mates:[{ign:"",uid:""},{ign:"",uid:""},{ign:"",uid:""}]});
let user=null,profile={ign:"",uid:"",is_admin:false},team=blankTeam(),tours=[],regs=[],tab="t",open=null;
const fmt=(d,o)=>new Date(d).toLocaleString("en-IN",o);
const teamReady=()=>profile.ign&&profile.uid&&team.id&&team.name&&team.mates.every(m=>m.ign&&m.uid);
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
const fail=e=>{toast(e.message||"Something went wrong. Try again.");return true};

async function load(){
const {data:{session}}=await sb.auth.getSession();
user=session?session.user:null;
const [t,r]=await Promise.all([sb.from("tournaments").select("*").order("starts_at"),sb.from("registrations").select("tournament_id,team_id")]);
tours=t.data||[];regs=r.data||[];
profile={ign:"",uid:"",is_admin:false};team=blankTeam();
if(user){
const p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
if(p.data)profile=p.data;
const m=await sb.from("teams").select("*").eq("owner",user.id).maybeSingle();
if(m.data){team=m.data;while(team.mates.length<3)team.mates.push({ign:"",uid:""})}
}
render();
}
sb.auth.onAuthStateChange(()=>setTimeout(load,0));

function tournaments(){
if(!tours.length)return `<section class="card"><h2>No tournaments yet</h2><p class="meta">Organizers will post upcoming tournaments here.</p></section>`;
return tours.map(t=>{
const n=regs.filter(r=>r.tournament_id===t.id).length,mine=!!team.id&&regs.some(r=>r.tournament_id===t.id&&r.team_id===team.id);
const on=Math.min(24,Math.round(n/t.slots*24));
const segs=Array.from({length:24},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
const s=new Date(t.starts_at).getTime();
const sched=open===t.id?`<ul class="sched">${MAPS.map((m,i)=>`<li><span>Match ${i+1} · ${m}</span><b>${fmt(s+i*45*6e4,{hour:"numeric",minute:"2-digit"})}</b></li>`).join("")}</ul><p class="note">Points: placement plus kills. Room ID and password are shared with registered squads before start.</p>`:"";
return `<section class="card"><h2>${esc(t.name)}</h2>
<p class="meta">${fmt(s,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})} · Squad (4 players)</p>
<div class="row"><span>Prize pool</span><b>${esc(t.prize)}</b></div>
<div class="row"><span>Entry</span><b>${t.fee?"₹"+t.fee:"Free"}</b></div>
<div class="row"><span>Squads registered</span><b>${n} of ${t.slots}</b></div>
<div class="slots" aria-hidden="true">${segs}</div>
<div class="btns"><button data-act="sched" data-id="${t.id}" aria-expanded="${open===t.id}">${open===t.id?"Hide schedule":"Schedule"}</button>
${mine?`<button class="p" data-act="unreg" data-id="${t.id}">Registered · Withdraw</button>`:`<button class="p" data-act="reg" data-id="${t.id}">Register squad</button>`}</div>${sched}</section>`}).join("")+`<p class="note">Entry fees are shown for information. Payments open in the next release.</p>`}

function squad(){
if(!user)return needLogin();
const rows=team.mates.map((m,i)=>`<div class="two"><div><label for="mn${i}">Player ${i+2} name</label><input id="mn${i}" value="${esc(m.ign)}" autocomplete="off"></div><div><label for="mu${i}">Free Fire UID</label><input id="mu${i}" value="${esc(m.uid)}" inputmode="numeric" autocomplete="off"></div></div>`).join("");
return `<section class="card"><h2>My squad</h2><p class="meta">${profile.ign?`<span class="tag">Captain</span> ${esc(profile.ign)} · ${esc(profile.uid)}`:"Add your profile first so you can lead the squad."}</p>
<label for="tn">Squad name</label><input id="tn" value="${esc(team.name)}" autocomplete="off">${rows}
<div class="btns"><button class="p" data-act="saveTeam">Save squad</button></div></section>`}

function needLogin(){return `<section class="card"><h2>Log in first</h2><p class="meta">Create an account or log in on the Profile tab.</p><div class="btns"><button class="p" data-act="tab" data-id="p">Go to Profile</button></div></section>`}

function prof(){
if(!user)return `<section class="card"><h2>Log in or sign up</h2><p class="meta">One account per player or squad captain.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="email">
<label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password">
<div class="btns"><button data-act="signup">Sign up</button><button class="p" data-act="login">Log in</button></div></section>`;
return `<section class="card"><h2>Player profile</h2><p class="meta">${esc(user.email)}</p>
<label for="pn">In-game name</label><input id="pn" value="${esc(profile.ign)}" autocomplete="off">
<label for="pu">Free Fire UID</label><input id="pu" value="${esc(profile.uid)}" inputmode="numeric" autocomplete="off">
<div class="btns"><button class="p" data-act="saveProfile">Save profile</button><button data-act="logout">Log out</button></div></section>`}

function admin(){
if(!profile.is_admin)return "";
return `<section class="card"><h2>New tournament</h2>
<label for="an">Name</label><input id="an">
<label for="ad">Start time</label><input id="ad" type="datetime-local">
<div class="two"><div><label for="af">Entry fee (₹)</label><input id="af" type="number" min="0" value="0"></div><div><label for="as">Squad slots</label><input id="as" type="number" min="2" value="48"></div></div>
<label for="ap">Prize pool</label><input id="ap" placeholder="₹10,000">
<div class="btns"><button class="p" data-act="addT">Create tournament</button></div></section>
<section class="card"><h2>Manage</h2>${tours.map(t=>`<div class="row"><span>${esc(t.name)}</span><button data-act="delT" data-id="${t.id}">Delete</button></div>`).join("")||'<p class="meta">Nothing to manage yet.</p>'}</section>`}

function render(){
const tabs=[["t","Tournaments"],["m","My squad"],["p","Profile"]];
if(profile.is_admin)tabs.push(["a","Organizer"]);
$("#nav").innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-id="${k}" aria-current="${tab===k}">${l}</button>`).join("");
$("#app").innerHTML=tab==="t"?tournaments():tab==="m"?squad():tab==="p"?prof()+(profile.is_admin?"":""):admin();
}

document.addEventListener("click",async e=>{
const b=e.target.closest("[data-act]");if(!b)return;
const a=b.dataset.act,id=b.dataset.id;
if(a==="tab"){tab=id;render();window.scrollTo(0,0);return}
if(a==="sched"){open=open===id?null:id;render();return}
if(a==="signup"||a==="login"){
const c={email:$("#em").value.trim(),password:$("#pw").value};
const r=a==="signup"?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
if(r.error)return fail(r.error);
if(a==="signup"&&!r.data.session)toast("Check your email to confirm your account, then log in.");
return}
if(a==="logout"){await sb.auth.signOut();tab="t";return}
if(a==="reg"){
if(!user){toast("Log in to register.");tab="p";render();return}
if(!teamReady()){toast("Complete your profile and save a squad with 3 teammates first.");tab=profile.ign?"m":"p";render();return}
const r=await sb.from("registrations").insert({tournament_id:id,team_id:team.id,owner:user.id});
if(r.error)return fail(r.error);
await load();toast("Squad registered. See you in the lobby.");return}
if(a==="unreg"){
const r=await sb.from("registrations").delete().eq("tournament_id",id).eq("team_id",team.id);
if(r.error)return fail(r.error);
await load();toast("Registration withdrawn.");return}
if(a==="saveProfile"){
const ign=$("#pn").value.trim(),uid=$("#pu").value.trim();
if(!ign||!/^\d{6,12}$/.test(uid)){toast("Enter your name and a UID of 6 to 12 digits.");return}
const r=await sb.from("profiles").upsert({id:user.id,ign,uid});
if(r.error)return fail(r.error);
await load();toast("Profile saved.");return}
if(a==="saveTeam"){
const mates=team.mates.map((m,i)=>({ign:$("#mn"+i).value.trim(),uid:$("#mu"+i).value.trim()}));
const r=await sb.from("teams").upsert({owner:user.id,name:$("#tn").value.trim(),mates},{onConflict:"owner"});
if(r.error)return fail(r.error);
await load();toast(teamReady()?"Squad saved. You can register now.":"Saved. Complete every field to register.");return}
if(a==="addT"){
const name=$("#an").value.trim(),d=$("#ad").value;
if(!name||!d){toast("Enter a name and start time.");return}
const r=await sb.from("tournaments").insert({name,starts_at:new Date(d).toISOString(),fee:+$("#af").value||0,slots:+$("#as").value||48,prize:$("#ap").value.trim()});
if(r.error)return fail(r.error);
await load();toast("Tournament created.");return}
if(a==="delT"){
if(!confirm("Delete this tournament and its registrations?"))return;
const r=await sb.from("tournaments").delete().eq("id",id);
if(r.error)return fail(r.error);
await load();toast("Tournament deleted.")}
});
render();
</script>
</body>
</html>
